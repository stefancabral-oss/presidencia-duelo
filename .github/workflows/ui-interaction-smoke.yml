name: UI Interaction Smoke

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      # `shared/` entra no bundle do app (domain.js importa elo.js), então
      # mudanças ali mudam o que este smoke exercita. `back/` fica de fora de
      # propósito: o servidor aqui é simulado, e incluí-lo daria a impressão de
      # uma cobertura de back que estes testes não têm.
      - 'shared/**'
      - 'docs/design/CARD_ART_NEUTRALITY_GUIDE.md'
      - 'stages/12_quality_gate_main/evidence/card-art-pilot-176/**'
      - 'stages/12_quality_gate_main/references/card-art-pilot-176.*'
      - 'stages/12_quality_gate_main/references/card-art-pilot-generation-contract.schema.json'
      - 'stages/12_quality_gate_main/references/card-art-pilot-participant-response.schema.json'
      - 'stages/12_quality_gate_main/references/card-art-pilot-receipt-registry.schema.json'
      - 'stages/12_quality_gate_main/references/card-art-pilot-recognition-rules.schema.json'
      - 'stages/12_quality_gate_main/references/card-art-pilot-response-bundle.schema.json'
      - 'stages/12_quality_gate_main/references/card-art-pilot-results.schema.json'
      - '.github/workflows/ui-interaction-smoke.yml'
  workflow_dispatch:

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install app
        run: npm ci --prefix app

      - name: Install browser
        run: node app/node_modules/playwright/cli.js install --with-deps ${{ matrix.browser }}

      - name: Build app and verify pilot evidence isolation
        env:
          VITE_GOOGLE_CLIENT_ID: e2e-client.apps.googleusercontent.com
        run: npm run build --prefix app

      - name: Start preview
        run: |
          npm run preview --prefix app -- --host 127.0.0.1 --port 4173 > /tmp/polimatch-vite.log 2>&1 &
          echo $! > /tmp/polimatch-vite.pid

      - name: Wait for preview
        run: |
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/polimatch-vite.log
          exit 1

      - name: Run browser interaction smoke
        env:
          POLIMATCH_E2E_BROWSER: ${{ matrix.browser }}
        run: node app/e2e/interaction-smoke.mjs

      - name: Validate login and logout when daily service fails
        env:
          POLIMATCH_E2E_BROWSER: ${{ matrix.browser }}
          POLIMATCH_E2E_GOOGLE: '1'
        run: node app/e2e/interaction-smoke.mjs

      - name: Validate deterministic daily session
        env:
          POLIMATCH_E2E_BROWSER: ${{ matrix.browser }}
        run: node app/e2e/daily-session.mjs
      - name: Validate issued pairs, discard focus and earned collection
        env:
          POLIMATCH_E2E_BROWSER: ${{ matrix.browser }}
        run: node app/e2e/game-progress.mjs

      - name: Validate optional daily prediction and closed reveal
        env:
          POLIMATCH_E2E_BROWSER: ${{ matrix.browser }}
        run: node app/e2e/daily-prediction.mjs

      - name: Validate fail-closed personal-only journey
        env:
          POLIMATCH_E2E_BROWSER: ${{ matrix.browser }}
        run: node app/e2e/aggregate-publication-gate.mjs

      - name: Validate prediction scoreboard across identity switches
        env:
          POLIMATCH_E2E_BROWSER: ${{ matrix.browser }}
        run: node app/e2e/prediction-identity.mjs

      - name: Validate accessible profile controls
        env:
          POLIMATCH_E2E_BROWSER: ${{ matrix.browser }}
        run: node app/e2e/accessible-profile.mjs
      - name: Validate editorial publication UI
        env:
          POLIMATCH_E2E_BROWSER: ${{ matrix.browser }}
        run: node app/e2e/editorial-gate.mjs
      - name: Validate recovered photos in current daily cards
        env:
          POLIMATCH_E2E_BROWSER: ${{ matrix.browser }}
        run: node app/e2e/photo-recovery.mjs
      - name: Validate blocked pilot form against canonical card geometry
        env:
          POLIMATCH_PILOT_BROWSER: ${{ matrix.browser }}
        run: npm run test:card-art-pilot-form --prefix app

      - name: Validate responsive layout
        env:
          POLIMATCH_E2E_BROWSER: ${{ matrix.browser }}
        run: node app/e2e/responsive-layout.mjs

      - name: Run vote recovery e2e
        env:
          POLIMATCH_E2E_BROWSER: ${{ matrix.browser }}
        run: node app/e2e/vote-recovery.mjs

      - name: Validate vote trust states
        env:
          POLIMATCH_E2E_BROWSER: ${{ matrix.browser }}
        run: node app/e2e/vote-trust-states.mjs
