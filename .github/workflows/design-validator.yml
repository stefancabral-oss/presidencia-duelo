name: Design Validator

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - 'docs/design/**'
      - 'stages/12_quality_gate_main/evidence/card-art-pilot-176/**'
      - 'stages/12_quality_gate_main/references/card-art-pilot-176.*'
      - 'stages/12_quality_gate_main/references/card-art-pilot-results.schema.json'
      - '.github/workflows/design-validator.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install app
        run: npm ci --prefix app
      - name: Test app
        run: npm test --prefix app
      - name: Validate card-art pilot schema, semantics and Docker context
        run: npm run test:card-art-pilot-contract --prefix app
      - name: Build app and verify pilot evidence isolation
        run: npm run build --prefix app
