name: UI Interaction Smoke

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      # `shared/` entra no bundle do app (domain.js importa elo.js), então
      # mudanças ali mudam o que este smoke exercita. `back/` fica de fora de
      # propósito: o servidor aqui é simulado, e incluí-lo daria a impressão de
      # uma cobertura de back que estes testes não têm.
      - 'shared/**'
      - '.github/workflows/ui-interaction-smoke.yml'
  workflow_dispatch:

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install app
        run: npm ci --prefix app

      - name: Install Playwright
        run: npm install --no-save playwright@1.55.1 --prefix app

      - name: Install browser
        run: npx --prefix app playwright install --with-deps ${{ matrix.browser }}

      - name: Build app
        env:
          VITE_GOOGLE_CLIENT_ID: e2e-client.apps.googleusercontent.com
        run: npm run build --prefix app

      - name: Start preview
        run: |
          npm run preview --prefix app -- --host 127.0.0.1 --port 4173 > /tmp/polimatch-vite.log 2>&1 &
          echo $! > /tmp/polimatch-vite.pid

      - name: Wait for preview
        run: |
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/polimatch-vite.log
          exit 1

      - name: Run browser interaction smoke
        env:
          POLIMATCH_E2E_BROWSER: ${{ matrix.browser }}
        run: node app/e2e/interaction-smoke.mjs

      - name: Validate login and logout when daily service fails
        env:
          POLIMATCH_E2E_BROWSER: ${{ matrix.browser }}
          POLIMATCH_E2E_GOOGLE: '1'
        run: node app/e2e/interaction-smoke.mjs

      - name: Validate deterministic daily session
        env:
          POLIMATCH_E2E_BROWSER: ${{ matrix.browser }}
        run: node app/e2e/daily-session.mjs

      - name: Validate responsive layout
        env:
          POLIMATCH_E2E_BROWSER: ${{ matrix.browser }}
        run: node app/e2e/responsive-layout.mjs

      - name: Run vote recovery e2e
        env:
          POLIMATCH_E2E_BROWSER: ${{ matrix.browser }}
        run: node app/e2e/vote-recovery.mjs

      - name: Validate vote trust states
        env:
          POLIMATCH_E2E_BROWSER: ${{ matrix.browser }}
        run: node app/e2e/vote-trust-states.mjs
