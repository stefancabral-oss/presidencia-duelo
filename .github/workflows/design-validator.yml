name: Design Validator

on:
  pull_request:
    branches: [main]
    paths:
      - 'front/**'
      - 'app/**'
      - 'docs/design/**'
      - '.github/workflows/design-validator.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install app
        run: npm ci --prefix app
      - name: Test app
        run: npm test --prefix app
      - name: Build app
        run: npm run build --prefix app
